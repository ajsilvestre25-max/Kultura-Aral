<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kultura-Aral Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b0f17] text-white min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-[#121824] border border-slate-700 rounded-2xl p-6 text-center space-y-4 shadow-2xl">
        <div class="text-4xl">🌱</div>
        <h1 class="text-2xl font-extrabold">Kultura-Aral is Live!</h1>
        <p class="text-xs text-slate-400">If you see this card, your GitHub Pages deployment is working successfully.</p>
        <button onclick="testClick()" class="w-full py-3 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-xs uppercase tracking-wider cursor-pointer">
            Click to Test Interactivity
        </button>
        <div id="testResult" class="text-xs font-bold text-emerald-400"></div>
    </div>

    <script>
        function testClick() {
            document.getElementById('testResult').innerText = "✅ Success! JavaScript and Interactivity are fully operational.";
            alert("Interactivity test passed successfully!");
        }
    </script>
</body>
</html>
